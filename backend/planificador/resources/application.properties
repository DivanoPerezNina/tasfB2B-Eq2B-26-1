# ── Servidor ─────────────────────────────────────────────────────────────────
server.port=8084

# El plan se devuelve en streaming (StreamingResponseBody). A horizontes grandes
# (millones de envíos) la respuesta tarda más que el timeout async por defecto de
# Spring MVC → AsyncRequestTimeoutException que truncaba el body. -1 = sin límite;
# la cadencia la controla el orquestador (regla Ta < Sa), no el timeout HTTP.
spring.mvc.async.request-timeout=-1

# ── Fuente de aeropuertos ───────────────────────────────────────────────────
# Por defecto el planificador carga aeropuertos desde MySQL usando DB_HOST,
# DB_PORT, DB_NAME, DB_USER, DB_PASS del .env. Para volver al TXT:
# PLANIFICADOR_AEROPUERTOS_FUENTE=txt

# ── Rutas de datos (sobrescribir con variables de entorno en producción) ──────
# PLANIFICADOR_RUTA_AEROPUERTOS  → ruta al aeropuertos.txt  (UTF-16 LE)
# PLANIFICADOR_RUTA_VUELOS       → ruta al vuelos.txt       (UTF-8)
# PLANIFICADOR_RUTA_ENVIOS       → directorio _envios_preliminar_ (sin barra)
tasf.planificador.ruta-aeropuertos=${PLANIFICADOR_RUTA_AEROPUERTOS:/tmp/tasf/aeropuertos.txt}
tasf.planificador.ruta-vuelos=${PLANIFICADOR_RUTA_VUELOS:/tmp/tasf/vuelos.txt}
tasf.planificador.ruta-envios=${PLANIFICADOR_RUTA_ENVIOS:/tmp/tasf/_envios_preliminar_}

# ── Defaults de planificación ────────────────────────────────────────────────
# Fecha inicio del dataset para el warm-up (YYYYMMDD)
tasf.planificador.fecha-dataset-inicio=${PLANIFICADOR_FECHA_INICIO:20260101}
# Criterio por defecto: ALEATORIO | EDF | FIFO
tasf.planificador.criterio-default=${PLANIFICADOR_CRITERIO:EDF}

# ── Jackson: deshabilitar (usamos serialización manual) ──────────────────────
spring.mvc.converters.preferred-json-mapper=jackson
spring.jackson.default-property-inclusion=non_null

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.pe.edu.pucp.tasf=INFO
